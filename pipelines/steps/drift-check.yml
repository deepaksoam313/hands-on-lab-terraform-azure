# steps/drift-check.yml
# Nightly drift detection — terraform plan -detailed-exitcode.
# Exit 0 = clean. Exit 2 = drift detected (warn + would open a ticket).

parameters:
- name: environment
  type: string
- name: component
  type: string

steps:

- script: |
    cat > backend.hcl <<EOF
    bucket         = "$(TF_STATE_BUCKET)"
    key            = "${{ parameters.environment }}/${{ parameters.component }}/terraform.tfstate"
    region         = "us-east-1"
    dynamodb_table = "$(TF_LOCK_TABLE)"
    encrypt        = true
    EOF
    cat > pipeline.auto.tfvars <<EOF
    vpc_id        = "$(VPC_ID)"
    subnet_id     = "$(SUBNET_ID)"
    bucket_suffix = "$(BUCKET_SUFFIX)"
    EOF
  displayName: "Generate backend.hcl and tfvars"
  workingDirectory: $(Build.SourcesDirectory)/environments/${{ parameters.environment }}/${{ parameters.component }}

- task: AWSShellScript@1
  displayName: "Init (${{ parameters.environment }})"
  inputs:
    awsCredentials: "sc-aws-${{ parameters.environment }}"
    regionName: "us-east-1"
    scriptType: "inline"
    workingDirectory: $(Build.SourcesDirectory)/environments/${{ parameters.environment }}/${{ parameters.component }}
    inlineScript: |
      terraform init -input=false -backend-config=backend.hcl

- task: AWSShellScript@1
  displayName: "Drift plan — ${{ parameters.environment }}"
  inputs:
    awsCredentials: "sc-aws-${{ parameters.environment }}"
    regionName: "us-east-1"
    scriptType: "inline"
    workingDirectory: $(Build.SourcesDirectory)/environments/${{ parameters.environment }}/${{ parameters.component }}
    inlineScript: |
      set +e
      terraform plan -detailed-exitcode -input=false -out=drift.tfplan
      EXIT=$?

      if [ $EXIT -eq 0 ]; then
        echo "No drift in ${{ parameters.environment }}/$(COMPONENT). Clean."

      elif [ $EXIT -eq 2 ]; then
        echo "##vso[task.logissue type=warning]DRIFT DETECTED: ${{ parameters.environment }}/$(COMPONENT)"
        terraform show -no-color drift.tfplan
        # Production: POST to ServiceNow or Teams webhook here.

      else
        echo "##vso[task.logissue type=error]Plan error during drift check (exit $EXIT)"
        exit 1
      fi
